<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cal — Management Review</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7; --sunk:#f2f1ed;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s8:#e34948;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#006300;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-1:#1a1a19; --plane:#0d0d0d; --sunk:#232322;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s8:#e66767;
    --good-text:#0ca30c;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d; --sunk:#232322;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s8:#e66767;
  --good-text:#0ca30c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 90px}
h1{font-size:21px;margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 4px;letter-spacing:-.005em}

.muted{color:var(--muted)}
header.bar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:22px}

button.primary{background:var(--s1);border-color:transparent;color:#fff}

.chip.serious{color:#a5451f} .chip.critical{color:var(--critical)}
.chip.flat{color:var(--muted)}
@media (prefers-color-scheme: dark){

:root[data-theme="dark"] .chip.serious{color:var(--serious)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;

td{padding:9px 10px 9px 0;border-bottom:1px solid var(--grid);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
tr.person{cursor:pointer}
tr.person:hover td{background:var(--sunk)}
tr.person td:first-child::before{content:'▸';color:var(--muted);margin-right:7px;font-size:11px}
tr.person.open td:first-child::before{content:'▾'}
tr.drill td{background:var(--sunk);padding:16px 14px}
.bar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden;min-width:70px}

.note{background:var(--sunk);border-radius:10px;padding:13px 15px;font-size:13px;color:var(--ink-2);margin:10px 0}

.ask li{margin:5px 0}
.login{max-width:340px;margin:14vh auto}
.login input{width:100%;padding:10px 12px;margin:6px 0 14px;border-radius:8px;

svg{display:block;max-width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

<script>

const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsdnhycndnenVhbGZ6ZmN6bGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NjU4MjksImV4cCI6MjA5MjA0MTgyOX0.WHvIcSVVmJgo1Os_SNQ6HrgzVG3Zs6VhmLa_t-K66aw';

const gbp = n => (n<0?'-':'')+'£'+Math.abs(Math.round(n)).toLocaleString();
const gbpk = n => { const a=Math.abs(n); if(a>=1e6) return (n<0?'-':'')+'£'+(Math.abs(n)/1e6).toFixed(2)+'m';
  if(a>=1e3) return (n<0?'-':'')+'£'+Math.round(Math.abs(n)/1e3)+'k'; return gbp(n); };
const pc = (n,d=1) => (n>=0?'+':'')+n.toFixed(d)+'%';
const pts = (n,d=1) => (n>=0?'+':'')+n.toFixed(d);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* The two quote files name the same people differently (KS vs KyleS). Mapping
   derived from the Booking Issues report, which carries full names for both. */
const ISSUER_ALIAS = {
  KS:'Kyle Speakman', KyleS:'Kyle Speakman', KA:'Katie Atkin', KatieA:'Katie Atkin',
  AH:'Aylesh Hall', AyleshH:'Aylesh Hall', Steven:'Steven Selfe', StevenS:'Steven Selfe',

const issuer = n => ISSUER_ALIAS[String(n||'').trim()] || (String(n||'').trim()||'(unattributed)');

/* Quote-pricing snapshot, precomputed by tools/build_quote_pricing.py from the
   scraped quote grid + rate cards + Special Price lanes. Embedded rather than
   live because the tariff tables only exist as scrapes, not in the database.
   Regional-tariff quotes are counted but never priced: their pricing table's

   is worse than no price. Re-run the script after each scrape to refresh. */
const PRICING = {
  scraped:'2026-08-06', profile:'Cal North', n:300, unpriced_yet:1,
  at:100, above:101, below:35, priced:235,
  at_v:27155, above_v:31625, below_v:16372,
  above_med:23, below_med:-31.75,
  unpriceable:{regional:62, regional_v:9065, other:1, other_v:180, no_match:1, no_match_v:226}
};

async function fetchAll(path){
  const out=[]; let from=0; const size=1000;
  for(;;){
    const r = await fetch(`${SB_URL}/rest/v1/${path}${path.includes('?')?'&':'?'}limit=${size}&offset=${from}`,
      {headers:{apikey:SB_KEY, Authorization:'Bearer '+session.access_token}});
    if(!r.ok) throw new Error(path.split('?')[0]+': '+r.status);
    const b=await r.json(); out.push(...b);
    if(b.length<size) break; from+=size;
  }
  return out;
}

      fetchAll('converted_quotes?select=week_label,depot,customer_name,quote_issued_by,income,tariff&week_label=gte.2026-W14&order=id'),
      fetchAll('non_converted_quotes?select=week_label,depot,customer_name,quote_issued_by,income,tariff,quote_no&week_label=gte.2026-W14&order=id'),
      fetchAll('cancelled_quotes?select=week_label,depot,customer_name,value,reason_code,our_ref&week_label=gte.2026-W14&order=id'),

    ]);

/* ============================================================
   FAIR COMPARISON
   Nobody is judged against the company average, because nobody
   works the company's average mix. Each person is judged against
   what the SAME work would have produced for everyone else —
   leave-one-out, so a person never sets their own benchmark.
   ============================================================ */
function valueBand(v){
  if(v==null) return 'unknown';
  if(v<50) return 'under 50'; if(v<100) return '50-100';
  if(v<250) return '100-250'; if(v<500) return '250-500'; return '500+';
}
const logit = p => Math.log(Math.max(1e-6,Math.min(1-1e-6,p))/(1-Math.max(1e-6,Math.min(1-1e-6,p))));
const inv   = z => 1/(1+Math.exp(-z));

/* significance of a gap in proportion terms: |gap| vs its standard error */
function sig(gapPct, n, p){
  if(!n) return {z:0,label:'no data',cls:'flat'};
  const se = Math.sqrt(Math.max(p*(1-p),0.01)/n)*100;
  const z = se? Math.abs(gapPct)/se : 0;
  if(z<1.6)  return {z,label:'within noise',cls:'flat'};
  if(z<2.6)  return {z,label:'probably real',cls:'warning'};
  return {z,label:'clearly real',cls:gapPct<0?'serious':'good'};
}

function analyse(){
  const dep=document.getElementById('depot').value;
  const keep = r => dep==='all' || r.depot===dep;
  const jobs = RAW.jobs.filter(keep);
  const canon = n => RAW.cust[n] || n;
  const repOf = n => { const t=String(n||'').trim(); if(!t) return '(unattributed)'; return RAW.rep[t]||t; };

  const weeks=[...new Set(jobs.map(j=>j.week_label))].sort();
  const cur=weeks[weeks.length-1], prev=weeks[weeks.length-2];
  const wk = w => jobs.filter(j=>j.week_label===w);
  const sum = rows => rows.reduce((a,r)=>({rev:a.rev+ +(r.revenue||0),
    prof:a.prof+ +(r.profit||0), n:a.n+1}),{rev:0,prof:0,n:0});

  const series = weeks.map(w=>{
    const s=sum(wk(w)); const byC={};
    wk(w).forEach(j=>{const c=canon(j.customer_name); byC[c]=(byC[c]||0)+ +(j.revenue||0);});
    const vals=Object.values(byC).sort((a,b)=>b-a); const tot=vals.reduce((a,b)=>a+b,0)||1;
    return {w,...s,margin:s.rev?s.prof/s.rev*100:0,customers:vals.length,
      top1:vals[0]/tot*100, top1name:Object.keys(byC).sort((a,b)=>byC[b]-byC[a])[0],
      top5:vals.slice(0,5).reduce((a,b)=>a+b,0)/tot*100,
      hhi:vals.reduce((a,v)=>a+Math.pow(v/tot*100,2),0)};
  });
  const C=series[series.length-1], P=series[series.length-2];

  /* revenue bridge */
  const cm={},pm={};
  wk(cur).forEach(j=>{const c=canon(j.customer_name); cm[c]=(cm[c]||0)+ +(j.revenue||0);});
  wk(prev).forEach(j=>{const c=canon(j.customer_name); pm[c]=(pm[c]||0)+ +(j.revenue||0);});
  const firstSeen={},lastSeen={};
  jobs.forEach(j=>{const c=canon(j.customer_name);
    if(!firstSeen[c]||j.week_label<firstSeen[c]) firstSeen[c]=j.week_label;
    if(!lastSeen[c]||j.week_label>lastSeen[c]) lastSeen[c]=j.week_label;});
  const bridge={neww:0,returned:0,grew:0,shrank:0,lost:0}, movers=[];
  new Set([...Object.keys(cm),...Object.keys(pm)]).forEach(c=>{
    const a=cm[c]||0,b=pm[c]||0,d=a-b;
    if(b===0&&firstSeen[c]===cur) bridge.neww+=d; else if(b===0) bridge.returned+=d;
    else if(a===0) bridge.lost+=d; else if(d>0) bridge.grew+=d; else bridge.shrank+=d;
    movers.push({c,cur:a,prev:b,d});
  });
  movers.sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
  const topMover=movers[0]||{c:'—',cur:0,prev:0,d:0};
  const exC=C.rev-topMover.cur, exP=P.rev-topMover.prev;
  const underlying = exP? (exC-exP)/exP*100 : 0;
  const headline = P.rev? (C.rev-P.rev)/P.rev*100 : 0;

  /* ---- SALES: margin standardised on the work mix each rep actually does ---- */
  const recent = jobs.filter(j=>j.week_label>=weeks[Math.max(0,weeks.length-12)] && +(j.revenue||0)>0);
  const byVeh={}; recent.forEach(j=>{const v=j.vehicle||'Unknown';
    byVeh[v]=byVeh[v]||{p:0,r:0}; byVeh[v].p+= +(j.profit||0); byVeh[v].r+= +(j.revenue||0);});
  const repRows={};
  recent.forEach(j=>{
    const r=repOf(j.sales_name), v=j.vehicle||'Unknown';
    repRows[r]=repRows[r]||{rev:0,prof:0,veh:{},cust:{},n:0};
    const R=repRows[r]; R.rev+= +(j.revenue||0); R.prof+= +(j.profit||0); R.n++;
    R.veh[v]=R.veh[v]||{r:0,p:0}; R.veh[v].r+= +(j.revenue||0); R.veh[v].p+= +(j.profit||0);
    const c=canon(j.customer_name);
    R.cust[c]=R.cust[c]||{r:0,p:0}; R.cust[c].r+= +(j.revenue||0); R.cust[c].p+= +(j.profit||0);
  });
  const reps=Object.entries(repRows).map(([name,R])=>{
    let expNum=0, base=0, lines=[];
    Object.entries(R.veh).forEach(([v,o])=>{
      const t=byVeh[v]; const oR=t.r-o.r, oP=t.p-o.p;
      if(oR<=0) return;                       // nobody else does this work: cannot judge
      const em=oP/oR;                          // margin everyone else gets on it
      expNum += em*o.r; base += o.r;
      lines.push({v, rev:o.r, actual:o.r?o.p/o.r*100:0, expected:em*100,
        gapMoney:(o.p - em*o.r)});
    });
    const expected = base? expNum/base*100 : null;
    const actual = R.rev? R.prof/R.rev*100 : 0;
    const actualOnBase = base? (lines.reduce((s,l)=>s+l.rev*l.actual/100,0)/base)*100 : actual;
    const gap = expected==null? null : actualOnBase-expected;
    lines.sort((a,b)=>a.gapMoney-b.gapMoney);
    const topCust=Object.entries(R.cust).map(([c,o])=>({c,rev:o.r,margin:o.r?o.p/o.r*100:0}))
      .sort((a,b)=>b.rev-a.rev).slice(0,5);
    return {name, rev:R.rev, jobs:R.n, actual, expected, gap, judged:base,
      money: gap==null?0:gap/100*base, lines:lines.slice(0,6), topCust,
      coverage: R.rev? base/R.rev*100:0};
  }).filter(r=>r.rev>25000).sort((a,b)=>(a.gap??99)-(b.gap??99));

  /* ---- QUOTE DESK ----
     De-duplicate first. The quote uploads append without checking what is already
     there, so an overlapping export duplicates rows: 38% of the converted file is
     re-uploaded copies of the same quote ref. Counting those inflates every rate. */
  const dedupe=(rows,key)=>{ const seen=new Set(); return rows.filter(r=>{
    const k=String(r[key]??''); if(!k) return true; if(seen.has(k)) return false; seen.add(k); return true; }); };
  const convU = dedupe(RAW.conv.filter(keep),'our_ref');
  const ncU   = dedupe(RAW.nonconv.filter(keep),'quote_no');
  const qs=[];
  convU.forEach(r=>qs.push({p:issuer(r.quote_issued_by),c:canon(r.customer_name),
    v:+(r.income||0), band:valueBand(+(r.income||0)), won:1, tariff:r.tariff}));
  ncU.forEach(r=>qs.push({p:issuer(r.quote_issued_by),c:canon(r.customer_name),
    v:+(r.income||0), band:valueBand(+(r.income||0)), won:0, tariff:r.tariff}));
  const overall = qs.length? qs.reduce((a,q)=>a+q.won,0)/qs.length : 0.5;
  const cAgg={}, bAgg={};
  qs.forEach(q=>{ cAgg[q.c]=cAgg[q.c]||{w:0,n:0}; cAgg[q.c].w+=q.won; cAgg[q.c].n++;
                  bAgg[q.band]=bAgg[q.band]||{w:0,n:0}; bAgg[q.band].w+=q.won; bAgg[q.band].n++; });
  const pAgg={};
  qs.forEach(q=>{ pAgg[q.p]=pAgg[q.p]||{w:0,n:0,cw:{},bn:{},lostVal:0,wonVal:0};
    const P=pAgg[q.p]; P.w+=q.won; P.n++;
    P.cw[q.c]=P.cw[q.c]||{w:0,n:0}; P.cw[q.c].w+=q.won; P.cw[q.c].n++;
    P.bn[q.band]=(P.bn[q.band]||0)+1;
    if(q.won) P.wonVal+=q.v; else P.lostVal+=q.v; });

  const desk=Object.entries(pAgg).map(([name,P])=>{
    /* Everything is computed on the JUDGED subset (quotes whose customer someone
       else also quotes) so actual, expected, the headline gap and the per-customer
       breakdown all share one basis and reconcile exactly. Per-customer rows use
       the SAME customer × value-band expectation as the headline — not a separate
       raw rate — so the drill's total row equals the headline gap. */
    let expSum=0, n=0, wonJ=0; const cAcc={};
    qs.filter(q=>q.p===name).forEach(q=>{
      const c=cAgg[q.c], b=bAgg[q.band];
      const cw=c.w-P.cw[q.c].w, cn=c.n-P.cw[q.c].n;      // leave-one-out on customer
      if(cn<=0) return;                                   // only this person quotes them
      const cRate=cw/cn, bRate=b.n? b.w/b.n : overall;
      const e = inv(logit(cRate)+logit(bRate)-logit(overall)); // customer × value
      expSum+=e; n++; wonJ+=q.won;
      const A=cAcc[q.c]=cAcc[q.c]||{w:0,e:0,n:0};
      A.w+=q.won; A.e+=e; A.n++;
    });
    const allCust=Object.entries(cAcc).map(([c,A])=>({c, n:A.n,
      actual:A.w/A.n*100, expected:A.e/A.n*100, gapQuotes:A.w-A.e}))
      .sort((a,b)=>a.gapQuotes-b.gapQuotes);
    const byCust=allCust.filter(x=>x.n>=8).slice(0,6);
    const shown=new Set(byCust.map(x=>x.c));
    const rest=allCust.filter(x=>!shown.has(x.c));
    const restRow=rest.length?{n:rest.reduce((s,x)=>s+x.n,0), custs:rest.length,
      gapQuotes:rest.reduce((s,x)=>s+x.gapQuotes,0)}:null;
    const actual = n? wonJ/n*100 : (P.n? P.w/P.n*100 : 0);
    const expected = n? expSum/n*100 : null;
    const gap = expected==null? null : actual-expected;
    const bands=Object.entries(P.bn).map(([b,c])=>({b,share:c/P.n*100}));
    return {name, quotes:P.n, actual, expected, gap, judged:n,
      wonJ, expWins:expSum, gapQ:wonJ-expSum,
      wonVal:P.wonVal, lostVal:P.lostVal, byCust, restRow, bands,
      s: gap==null? null : sig(gap,n,actual/100)};
  }).filter(d=>d.quotes>=60).sort((a,b)=>(a.gap??99)-(b.gap??99));

  /* ---- COMPANY conversion across all THREE files ----
     Only Q-prefixed cancellations are quote cancellations; BT refs are booking
     cancellations and are not part of the quote funnel. 259 of the cancelled
     rows also appear in the non-converted file, so they are counted once. */
  const cancQ = dedupe(RAW.canc.filter(keep).filter(r=>String(r.our_ref||'').startsWith('Q')),'our_ref');
  const convRefs = new Set(convU.map(r=>String(r.our_ref||'')));
  const cancRefs = new Set(cancQ.map(r=>String(r.our_ref||'')));
  /* a quote has ONE outcome: won beats cancelled beats still-open */
  const cancUnique = cancQ.filter(r=>!convRefs.has(String(r.our_ref||'')));
  const ncUnique = ncU.filter(r=>!convRefs.has(String(r.quote_no||''))
                              && !cancRefs.has(String(r.quote_no||'')));
  const won = convU.length;
  const lostNc = ncUnique.length;
  const lostCa = cancUnique.length;
  const funnel = {
    won, lostNc, lostCa, dupes: (RAW.conv.filter(keep).length-convU.length)+(RAW.nonconv.filter(keep).length-ncU.length),
    total: won+lostNc+lostCa,
    rate: (won+lostNc+lostCa)? won/(won+lostNc+lostCa)*100 : 0,
    rateTwoFile: (won+lostNc)? won/(won+lostNc)*100 : 0,
    cancValue: cancQ.reduce((a,r)=>a+ +(r.value||0),0)
  };
  const cancReasons = Object.entries(cancQ.reduce((m,r)=>{
      const k=r.reason_code||'(none)'; m[k]=m[k]||{n:0,v:0}; m[k].n++; m[k].v+= +(r.value||0); return m;},{}))
    .map(([code,o])=>({code,n:o.n,v:o.v,pct:cancQ.length?o.n/cancQ.length*100:0}))
    .sort((a,b)=>b.n-a.n);

  /* company value-band table for context */
  const bandTable=['under 50','50-100','100-250','250-500','500+'].map(b=>{
    const rows=qs.filter(q=>q.band===b);
    return {b, n:rows.length, rate: rows.length? rows.reduce((a,q)=>a+q.won,0)/rows.length*100:0,
      lost: rows.filter(q=>!q.won).reduce((a,q)=>a+q.v,0)};
  });

  /* supply chain */
  const mix=weeks.slice(-12).map(w=>{ let cr=0,cp=0,xr=0,xp=0;
    wk(w).forEach(j=>{ if(/^[A-Za-z]/.test(j.call_sign||'')){cr+= +(j.revenue||0); cp+= +(j.profit||0);}
      else {xr+= +(j.revenue||0); xp+= +(j.profit||0);} });
    return {w, share:(cr+xr)?cr/(cr+xr)*100:0, cm:cr?cp/cr*100:0, xm:xr?xp/xr*100:0};});

  /* onboarding & retention */
  const newC=weeks.slice(-8).map(w=>{
    const names=Object.keys(firstSeen).filter(c=>firstSeen[c]===w);
    const set=new Set(names);
    const val=jobs.filter(j=>set.has(canon(j.customer_name))).reduce((s,j)=>s+ +(j.revenue||0),0);
    return {w,count:names.length,val};});
  const rev12={}; weeks.slice(-12).forEach(w=>wk(w).forEach(j=>{const c=canon(j.customer_name);
    rev12[c]=(rev12[c]||0)+ +(j.revenue||0);}));
  const atRisk=Object.keys(rev12).filter(c=>lastSeen[c]<weeks[weeks.length-3])
    .map(c=>({c,rev:rev12[c],last:lastSeen[c]})).sort((a,b)=>b.rev-a.rev).slice(0,8);

  const lossCur=wk(cur).filter(j=>+(j.profit||0)<0), lossPrev=wk(prev).filter(j=>+(j.profit||0)<0);
  return {weeks,cur,prev,series,C,P,bridge,movers,topMover,headline,underlying,
    reps,desk,bandTable,mix,newC,atRisk,dep,funnel,cancReasons,
    lossCur, lossVal:lossCur.reduce((s,j)=>s+ +(j.profit||0),0),
    lossValP:lossPrev.reduce((s,j)=>s+ +(j.profit||0),0)};
}

function cracks(A){
  const out=[]; const push=(sev,t,d,ev)=>out.push({sev,t,d,ev});
  if(A.headline>0 && A.underlying<0)
    push('critical','A good headline is hiding a shrinking base',
      `Revenue rose ${pc(A.headline)}, but strip out ${esc(A.topMover.c)} and the rest of the book fell ${pc(A.underlying)}.`,
      `${esc(A.topMover.c)}: ${gbp(A.topMover.prev)} → ${gbp(A.topMover.cur)}. Everything else: ${gbp(exRest(A))}.`);
  const hhiCh=A.P.hhi?(A.C.hhi-A.P.hhi)/A.P.hhi*100:0;
  if(hhiCh>15) push(A.C.top1>25?'critical':'serious','Concentration got materially worse',
    `Your largest customer is now ${A.C.top1.toFixed(1)}% of revenue, up from ${A.P.top1.toFixed(1)}%.`,
    `HHI ${Math.round(A.P.hhi)} → ${Math.round(A.C.hhi)} (${pc(hhiCh,0)}). Top 5 now ${A.C.top5.toFixed(1)}%.`);
  if(A.headline>0 && A.C.margin<A.P.margin-0.5)
    push('serious','Revenue up, margin down','You sold more and kept less of it.',
      `Margin ${A.P.margin.toFixed(1)}% → ${A.C.margin.toFixed(1)}%.`);
  if(A.C.customers<A.P.customers && A.headline>0)
    push('warning','Fewer customers, more revenue','The book is getting narrower even as it gets bigger.',
      `Active customers ${A.P.customers} → ${A.C.customers}.`);
  const n=A.newC.slice(-4), o=A.newC.slice(-8,-4);
  const nv=n.reduce((s,x)=>s+x.val,0), ov=o.reduce((s,x)=>s+x.val,0);
  if(ov>0 && nv<ov*0.6) push('warning','New customers are getting smaller',
    'Still winning logos, but worth much less than the cohort before. Count alone would look fine.',
    `Last 4 weeks: ${n.reduce((s,x)=>s+x.count,0)} worth ${gbp(nv)}. Previous 4: ${o.reduce((s,x)=>s+x.count,0)} worth ${gbp(ov)}.`);
  const m0=A.mix[0], m1=A.mix[A.mix.length-1];
  if(m0&&m1&&m1.share<m0.share-3) push('serious','Contract driver share is falling',
    'Work is drifting to the spot market — capacity you pay to keep and are not using.',
    `${m0.share.toFixed(1)}% → ${m1.share.toFixed(1)}% over ${A.mix.length} weeks.`);
  if(A.lossVal<A.lossValP) push('warning','Loss-making work increased','',
    `${A.lossCur.length} jobs totalling ${gbp(A.lossVal)} (last week ${gbp(A.lossValP)}).`);
  /* fair-comparison findings only — never raw rank */
  const badRep=A.reps.find(r=>r.gap!=null && r.gap<-6 && r.judged>60000);
  if(badRep) push('serious',`${esc(badRep.name)} is below the rate for the work they do`,
    `Not a comparison against the company average — against what the same vehicles and tariffs return for everyone else.`,
    `${badRep.actual.toFixed(1)}% vs ${badRep.expected.toFixed(1)}% expected on ${gbp(badRep.judged)} of comparable work — about ${gbp(Math.abs(badRep.money))} of margin.`);
  const badDesk=A.desk.find(d=>d.gap!=null && d.s && d.s.cls!=='flat' && d.gap<-6);
  if(badDesk) push('warning',`${esc(badDesk.name)}'s conversion is below their own book`,
    `Their customers convert at ${badDesk.expected.toFixed(0)}% for everyone else; they are getting ${badDesk.actual.toFixed(0)}%.`,
    `${badDesk.quotes} quotes — ${badDesk.s.label}.`);
  if(!out.length) push('good','Nothing is hiding under the headline','All measures moved together.','');
  const ord={critical:0,serious:1,warning:2,good:3};
  return out.sort((a,b)=>ord[a.sev]-ord[b.sev]);
}
const exRest = A => (A.C.rev-A.topMover.cur)-(A.P.rev-A.topMover.prev);

/* ---------- charts ---------- */
function bridgeChart(A){
  const items=[{k:'New',v:A.bridge.neww,c:'var(--s3)'},{k:'Returned',v:A.bridge.returned,c:'var(--s1)'},
    {k:'Grew',v:A.bridge.grew,c:'var(--s1)'},{k:'Shrank',v:A.bridge.shrank,c:'var(--s2)'},
    {k:'Lost',v:A.bridge.lost,c:'var(--s8)'}];
  const W=620,H=190,pad=30,bw=64,gap=(W-pad*2-bw*items.length)/(items.length-1||1);
  let run=A.P.rev; const p=[];
  items.forEach(it=>{p.push({...it,from:run,to:run+it.v}); run+=it.v;});
  const lo=Math.min(A.P.rev,A.C.rev,...p.map(x=>Math.min(x.from,x.to)));
  const hi=Math.max(A.P.rev,A.C.rev,...p.map(x=>Math.max(x.from,x.to)));
  const sp=(hi-lo)||1, y=v=>H-pad-((v-lo)/sp)*(H-pad*2);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue bridge">`;
  s+=`<line x1="${pad}" y1="${y(A.P.rev)}" x2="${W-pad}" y2="${y(A.P.rev)}" stroke="var(--axis)" stroke-dasharray="3 3"/>`;
  p.forEach((x,i)=>{const px=pad+i*(bw+gap), top=y(Math.max(x.from,x.to)), h=Math.max(Math.abs(y(x.from)-y(x.to)),2);
    s+=`<rect x="${px}" y="${top}" width="${bw}" height="${h}" rx="4" fill="${x.c}" stroke="var(--surface-1)" stroke-width="2"><title>${x.k}: ${gbp(x.v)}</title></rect>`;
    s+=`<text x="${px+bw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${x.k}</text>`;
    s+=`<text x="${px+bw/2}" y="${top-6}" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink-2)">${gbpk(x.v)}</text>`;});
  return s+'</svg>';
}
function spark(vals,color,w=360,h=64){
  if(!vals.length) return '';
  const lo=Math.min(...vals),hi=Math.max(...vals),sp=(hi-lo)||1;
  const pt=vals.map((v,i)=>`${(i/(vals.length-1||1))*(w-4)+2},${h-3-((v-lo)/sp)*(h-8)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pt}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
/* actual vs expected as a two-ended bar */
function gapBar(actual,expected,lo,hi){
  const W=110,H=16, x=v=>((v-lo)/((hi-lo)||1))*W;
  const a=x(actual), e=x(expected);
  const good=actual>=expected;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
    <line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="var(--grid)" stroke-width="2"/>
    <rect x="${Math.min(a,e)}" y="${H/2-3}" width="${Math.max(Math.abs(a-e),1.5)}" height="6" rx="3"
      fill="${good?'var(--good)':'var(--critical)'}"/>
    <line x1="${e}" y1="2" x2="${e}" y2="${H-2}" stroke="var(--ink-2)" stroke-width="2"/>
    <circle cx="${a}" cy="${H/2}" r="4" fill="${good?'var(--good)':'var(--critical)'}" stroke="var(--surface-1)" stroke-width="2"/>
  </svg>`;
}

/* The pricing snapshot card. Static by design — see the PRICING comment. */
function pricingCard(){
  const P=PRICING, u=P.unpriceable;
  const excl=u.regional+u.other+u.no_match;
  const covered=P.priced/(P.n-P.unpriced_yet)*100;
  const seg=(n,c,label)=>`<div style="flex:${Math.max(n,1)};background:${c};min-width:34px;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;
    white-space:nowrap;overflow:hidden">${label}</div>`;
  return `
  <div class="card">
    <h2>Quote pricing — the rate card or a judgement call?</h2>
    <p class="sub">Every open quote priced against the tariff its customer is actually assigned
      (matched customer-first, the only rule that comes out unbiased). Snapshot of the
      ${P.profile} quote book, ${P.n} quotes, scraped ${P.scraped} — the depot filter above
      does not apply to this card.</p>
    <div class="hero">
      <div><div class="lab">On the card</div><div class="fig">${(P.at/P.priced*100).toFixed(0)}%</div>
        <div class="delta muted">${P.at} quotes · ${gbpk(P.at_v)}</div></div>
      <div><div class="lab">Above the card</div><div class="fig">${(P.above/P.priced*100).toFixed(0)}%</div>
        <div class="delta muted">${P.above} quotes · median +£${Math.round(P.above_med)}</div></div>
      <div><div class="lab">Below the card</div><div class="fig">${(P.below/P.priced*100).toFixed(0)}%</div>
        <div class="delta muted">${P.below} quotes · median −£${Math.abs(Math.round(P.below_med))}</div></div>
      <div><div class="lab">Priceable</div><div class="fig">${covered.toFixed(0)}%</div>
        <div class="delta muted">${P.priced} of ${P.n-P.unpriced_yet}</div></div>
    </div>
    <div style="display:flex;height:30px;border-radius:8px;overflow:hidden;gap:2px;margin:6px 0 4px">
      ${seg(P.at,'var(--s3)',P.at)}
      ${seg(P.above,'var(--s4)',P.above)}
      ${seg(P.below,'var(--s2)',P.below)}
      ${seg(excl,'var(--axis)',excl+' excluded')}
    </div>
    <div class="legend"><span><i style="background:var(--s3)"></i>Within 2% of the card</span>
      <span><i style="background:var(--s4)"></i>Above it</span>
      <span><i style="background:var(--s2)"></i>Below it</span>
      <span><i style="background:var(--axis)"></i>Cannot be priced yet</span></div>
    <div class="note"><b>"Above the card" is not proof anyone touched the price.</b> Drop charges,
      waiting time, handballing and congestion are system rates that get baked into the quoted
      figure, so a quote £18 over its card may be entirely automatic. Delivery Master stores the
      flags that would settle it — a manual-price marker and a quote-amended marker — but exposes
      neither; that is the top item on the vendor question list. Until then this card separates
      <b>on-card</b> from <b>off-card</b>, not system from person. <b>Below the card</b> is the
      cleaner signal: extras only push prices up, so under-card quotes are genuine discounts or
      pricing errors — ${P.below} of them, ${gbpk(P.below_v)} of quoted value, median
      −£${Math.abs(Math.round(P.below_med))} each.</div>
    <div class="note"><b>What is excluded, and why.</b> ${u.regional} quotes
      (${(u.regional/(P.n-P.unpriced_yet)*100).toFixed(0)}%, ${gbpk(u.regional_v)}) sit on the eight
      Regional tariffs, which have no distance rate — they are priced from a region-to-region table
      whose column meanings the vendor has not yet confirmed. Rather than guess, they are excluded
      and shown grey. ${u.other+u.no_match} further quotes had no matching rate card. Quotes priced
      from customer-specific postcode lanes (fixed lane prices) are included — those lanes were
      validated against real jobs to the penny.</div>
  </div>`;
}

/* ---------- render ---------- */
function render(){
  A=analyse(); const K=cracks(A);
  const worst=K[0].sev, tone=worst==='critical'?'bad':(worst==='serious'||worst==='warning')?'warn':'';
  document.getElementById('period').textContent=`Week ${A.cur} vs ${A.prev} · ${A.dep==='all'?'North + South':A.dep}`;

  const mLo=Math.min(...A.reps.flatMap(r=>[r.actual,r.expected??r.actual]))-2;
  const mHi=Math.max(...A.reps.flatMap(r=>[r.actual,r.expected??r.actual]))+2;
  const qLo=Math.min(...A.desk.flatMap(d=>[d.actual,d.expected??d.actual]))-3;
  const qHi=Math.max(...A.desk.flatMap(d=>[d.actual,d.expected??d.actual]))+3;

  document.getElementById('content').innerHTML=`
  <div class="card verdict ${tone}">
    <div class="hero">
      <div><div class="lab">Revenue</div><div class="fig">${gbp(A.C.rev)}</div>
        <div class="delta ${A.headline>=0?'up':'down'}">${pc(A.headline)} vs last week</div></div>
      <div><div class="lab">Underlying (ex ${esc(A.topMover.c).slice(0,16)})</div>
        <div class="fig">${pc(A.underlying)}</div><div class="delta muted">the part that repeats</div></div>
      <div><div class="lab">Margin</div><div class="fig">${A.C.margin.toFixed(1)}%</div>
        <div class="delta ${A.C.margin>=A.P.margin?'up':'down'}">${pts(A.C.margin-A.P.margin)} pts</div></div>
      <div><div class="lab">Top customer</div><div class="fig">${A.C.top1.toFixed(1)}%</div>
        <div class="delta ${A.C.top1<=A.P.top1?'up':'down'}">${pts(A.C.top1-A.P.top1)} pts</div></div>
    </div>
    <p>${A.headline>0&&A.underlying<0
      ? `Revenue rose <strong>${pc(A.headline)}</strong> to <strong>${gbp(A.C.rev)}</strong> — but excluding ${esc(A.topMover.c)} the rest of the book <strong class="down">fell ${pc(A.underlying)}</strong>.`
      : `Revenue ${A.headline>=0?'rose':'fell'} <strong>${pc(A.headline)}</strong> to <strong>${gbp(A.C.rev)}</strong>; excluding ${esc(A.topMover.c)} the rest ${A.underlying>=0?'rose':'fell'} <strong>${pc(A.underlying)}</strong>.`}</p>
  </div>

  <div class="card">
    <h2>What the headline is hiding</h2>
    ${K.map(k=>`<div class="crack"><div class="dot" style="background:var(--${k.sev})"></div>
      <div class="body"><div class="t">${k.t}</div><div class="d">${k.d}</div>
      ${k.ev?`<div class="ev">${k.ev}</div>`:''}</div>
      <div><span class="chip ${k.sev}">${k.sev}</span></div></div>`).join('')}
  </div>

  <div class="grid two">
    <div class="card"><h2>Where the change came from</h2>
      <p class="sub">${gbp(A.P.rev)} → ${gbp(A.C.rev)}, by what each customer did.</p>
      ${bridgeChart(A)}
      <div class="legend"><span><i style="background:var(--s3)"></i>New</span>
      <span><i style="background:var(--s1)"></i>Returned / grew</span>
      <span><i style="background:var(--s2)"></i>Shrank</span>
      <span><i style="background:var(--s8)"></i>Lost</span></div></div>
    <div class="card"><h2>Concentration</h2>
      <p class="sub">Top-customer share, 12 weeks. Rising means a better week is a less safe week.</p>
      ${spark(A.series.slice(-12).map(s=>s.top1),'var(--s2)')}
      <table style="margin-top:8px"><tbody>
        <tr><td class="muted">Largest customer</td><td class="num">${esc(A.C.top1name||'—')}</td></tr>
        <tr><td class="muted">Top 5 share</td><td class="num">${A.C.top5.toFixed(1)}%</td></tr>
        <tr><td class="muted">HHI</td><td class="num">${Math.round(A.C.hhi)} (was ${Math.round(A.P.hhi)})</td></tr>
      </tbody></table></div>
  </div>

  <div class="card">
    <h2>Sales — margin against the work they actually do</h2>
    <div class="note"><b>How this is judged.</b> Nobody is compared with the company average, because nobody
      works the average mix. For every vehicle and tariff a rep handles, we take the margin
      <b>everyone else</b> gets on that same work, weight it by how much of it they do, and add it up.
      That is their expected margin. The gap is the part that is theirs. A rep on low-margin work is not
      penalised for it; a rep on rich work gets no credit for it.</div>
    <div class="scroll"><table>
      <thead><tr><th>Rep</th><th class="num">Revenue</th><th class="num">Actual</th>
      <th class="num">Expected</th><th class="num">Gap</th><th>vs expected</th><th class="num">Margin effect</th></tr></thead>
      <tbody>${A.reps.map((r,i)=>`
        <tr class="person" data-kind="rep" data-i="${i}">
          <td>${esc(r.name)}</td><td class="num">${gbp(r.rev)}</td>
          <td class="num">${r.actual.toFixed(1)}%</td>
          <td class="num">${r.expected==null?'—':r.expected.toFixed(1)+'%'}</td>
          <td class="num ${r.gap==null?'':r.gap<0?'down':'up'}">${r.gap==null?'—':pts(r.gap)}</td>
          <td>${r.expected==null?'':gapBar(r.actual,r.expected,mLo,mHi)}</td>
          <td class="num ${r.money<0?'down':'up'}">${r.gap==null?'—':gbpk(r.money)}</td>
        </tr>
        <tr class="drill" id="rep-${i}" hidden><td colspan="7"></td></tr>`).join('')}</tbody>
    </table></div>
    <p class="foot">Click a rep for what their number is made of. "Margin effect" is the gap applied to the
      comparable work only — what closing it would be worth over the last ${Math.min(A.weeks.length,12)} weeks.</p>
  </div>

  <div class="card">
    <h2>Quote conversion — the whole funnel</h2>
    <p class="sub">All three reports. A quote either converts, is never taken up, or is booked and then
      cancelled. Only Q-referenced cancellations belong here — BT refs are booking cancellations, not
      quote outcomes.</p>
    <div class="scroll"><table>
      <thead><tr><th>Outcome</th><th class="num">Quotes</th><th class="num">Share</th><th>Source report</th></tr></thead>
      <tbody>
        <tr><td>Converted</td><td class="num">${A.funnel.won.toLocaleString()}</td>
          <td class="num">${(A.funnel.won/A.funnel.total*100).toFixed(1)}%</td><td class="muted">Quote Conversion</td></tr>
        <tr><td>Never taken up</td><td class="num">${A.funnel.lostNc.toLocaleString()}</td>
          <td class="num">${(A.funnel.lostNc/A.funnel.total*100).toFixed(1)}%</td><td class="muted">Non-Converted Quotes</td></tr>
        <tr><td>Booked then cancelled</td><td class="num">${A.funnel.lostCa.toLocaleString()}</td>
          <td class="num">${(A.funnel.lostCa/A.funnel.total*100).toFixed(1)}%</td><td class="muted">Cancelled Bookings (Q refs)</td></tr>
        <tr><td><b>Conversion rate</b></td><td class="num"><b>${A.funnel.total.toLocaleString()}</b></td>
          <td class="num"><b>${A.funnel.rate.toFixed(1)}%</b></td>
          <td class="muted">converted ÷ all three</td></tr>
      </tbody></table></div>
    ${A.funnel.lostCa/Math.max(A.funnel.total,1) < 0.12 ? `<div class="note" style="border-left:4px solid var(--critical)">
      <b>This rate is not trustworthy.</b> Cancellations are only
      ${(A.funnel.lostCa/A.funnel.total*100).toFixed(1)}% of quotes here. A like-for-like export from
      Delivery Master with <b>"Include Auto Archived Quotations"</b> ticked returns roughly
      <b>30%</b> — that checkbox defaults to OFF, so the loaded history is missing most cancelled
      quotes. Measured on July 2026 Cal North: 67 cancellations in this database against 944 in a
      fresh export, which moves conversion from about 53% to <b>36.9%</b>.
      Until the cancelled history is re-uploaded with that box ticked, treat every conversion figure
      on this page as roughly <b>16 points too high</b>.</div>` : ''}
    <div class="note"><b>Read this before comparing to anything else.</b> The true rate is
      <b>${A.funnel.rate.toFixed(1)}%</b>. Leaving cancellations out gives
      ${A.funnel.rateTwoFile.toFixed(1)}% — flattering by
      ${(A.funnel.rateTwoFile-A.funnel.rate).toFixed(1)} points.
      ${A.funnel.dupes.toLocaleString()} duplicate rows from overlapping uploads were removed before counting, and a quote with more than one outcome is counted once under the strongest one. Cancelled quotes are worth ${gbp(A.funnel.cancValue)}.</div>
    <h3>Why bookings get cancelled</h3>
    <div class="scroll"><table>
      <thead><tr><th>Reason</th><th class="num">Count</th><th class="num">Share</th><th class="num">Value</th></tr></thead>
      <tbody>${A.cancReasons.map(r=>`<tr><td>${esc(r.code)}</td><td class="num">${r.n}</td>
        <td class="num">${r.pct.toFixed(1)}%</td><td class="num">${gbp(r.v)}</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="foot">"Non-Compliant" means the cancellation was logged without one of the RC1–RC5 codes.
      At ${(A.cancReasons.find(r=>r.code==='Non-Compliant')?.pct||0).toFixed(0)}% it is a process gap:
      that share of cancellations has no recorded reason to act on.</p>
  </div>

  ${pricingCard()}

  <div class="card">
    <h2>Quote desk — conversion against the quotes they were given</h2>
    <div class="note"><b>These per-person rates exclude cancellations.</b> The Cancelled Bookings report
      has no "issued by" column, so a cancellation cannot be attributed to the person who quoted it.
      Per-person figures are therefore converted ÷ (converted + never taken up) and will read about
      ${(A.funnel.rateTwoFile-A.funnel.rate).toFixed(1)} points higher than the company rate above.
      The <i>gaps</i> are unaffected — actual and expected are both on this basis — but the absolute
      percentages are not the company number.</div>
    <div class="note"><b>Why the raw rate is unfair.</b> Customers convert at anywhere from
      11% to 100%, and a £500 quote converts at ${A.bandTable[4].rate.toFixed(0)}% against
      ${A.bandTable[0].rate.toFixed(0)}% for one under £50. Someone handed hard customers and big
      numbers will lose more, whatever they do. So each quote gets an expected win chance from
      <b>how that customer converts for everyone else</b>, adjusted for the value band, and the person
      is judged on actual versus that. The "meaningful?" column says whether the gap is bigger than
      normal variation for their number of quotes — a small sample is not a verdict.</div>
    <div class="scroll"><table>
      <thead><tr><th>Person</th><th class="num">Quotes</th><th class="num">Actual</th>
      <th class="num">Expected</th><th class="num">Gap</th><th>vs expected</th>
      <th>Meaningful?</th><th class="num">Value lost</th></tr></thead>
      <tbody>${A.desk.map((d,i)=>`
        <tr class="person" data-kind="desk" data-i="${i}">
          <td>${esc(d.name)}</td><td class="num">${d.quotes}</td>
          <td class="num">${d.actual.toFixed(1)}%</td>
          <td class="num">${d.expected==null?'—':d.expected.toFixed(1)+'%'}</td>
          <td class="num ${d.gap==null?'':d.gap<0?'down':'up'}">${d.gap==null?'—':pts(d.gap)}</td>
          <td>${d.expected==null?'':gapBar(d.actual,d.expected,qLo,qHi)}</td>
          <td><span class="chip ${d.s?d.s.cls:'flat'}">${d.s?d.s.label:'—'}</span></td>
          <td class="num">${gbpk(d.lostVal)}</td>
        </tr>
        <tr class="drill" id="desk-${i}" hidden><td colspan="8"></td></tr>`).join('')}</tbody>
    </table></div>
    <h3>Where the money actually goes</h3>
    <div class="scroll"><table>
      <thead><tr><th>Quote value</th><th class="num">Quotes</th><th class="num">Conversion</th><th class="num">Value lost</th></tr></thead>
      <tbody>${A.bandTable.map(b=>`<tr><td>${b.b}</td><td class="num">${b.n}</td>
        <td class="num">${b.rate.toFixed(1)}%</td><td class="num">${gbp(b.lost)}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>

  <div class="grid two">
    <div class="card"><h2>Supply chain</h2>
      <p class="sub">Contract drivers (letter call signs) versus Courier Exchange.</p>
      <table><tbody>
        <tr><td class="muted">Contract share of revenue</td><td class="num">${A.mix[A.mix.length-1].share.toFixed(1)}%
          <span class="muted">(was ${A.mix[0].share.toFixed(1)}%)</span></td></tr>
        <tr><td class="muted">Contract margin</td><td class="num">${A.mix[A.mix.length-1].cm.toFixed(1)}%</td></tr>
        <tr><td class="muted">CX margin</td><td class="num">${A.mix[A.mix.length-1].xm.toFixed(1)}%</td></tr>
      </tbody></table>
      ${spark(A.mix.map(m=>m.share),'var(--s3)')}
      <p class="foot">Contract share, last ${A.mix.length} weeks. Margin is not like-for-like if contract
        drivers are on a fixed weekly rate — worth confirming before drawing a conclusion.</p></div>
    <div class="card"><h2>Onboarding &amp; retention</h2>
      <div class="scroll"><table>
        <thead><tr><th>Week</th><th class="num">New</th><th class="num">Lifetime rev</th><th class="num">Avg each</th></tr></thead>
        <tbody>${A.newC.map(n=>`<tr><td>${n.w}</td><td class="num">${n.count}</td>
          <td class="num">${gbp(n.val)}</td><td class="num">${n.count?gbp(n.val/n.count):'—'}</td></tr>`).join('')}</tbody>
      </table></div>
      <h3>Quietly gone</h3>
      <div class="scroll"><table>
        <thead><tr><th>Customer</th><th class="num">12-week rev</th><th class="num">Last seen</th></tr></thead>
        <tbody>${A.atRisk.map(r=>`<tr><td>${esc(r.c).slice(0,30)}</td>
          <td class="num">${gbp(r.rev)}</td><td class="num">${r.last}</td></tr>`).join('')}</tbody>
      </table></div></div>
  </div>

  <p class="foot">Expected values are leave-one-out: a person never contributes to their own benchmark.
    Where nobody else does comparable work, the row is left unjudged rather than guessed.
    Booking Issues and Response Time are exported nightly but not yet in the database, so service
    quality and allocation speed are not represented here.</p>`;

  document.querySelectorAll('tr.person').forEach(tr=>tr.onclick=()=>toggle(tr));
}

function toggle(tr){
  const kind=tr.dataset.kind, i=+tr.dataset.i;
  const row=document.getElementById(`${kind}-${i}`);
  const open=!row.hidden;
  row.hidden=open; tr.classList.toggle('open',!open);
  if(!open) row.firstElementChild.innerHTML = kind==='rep'? repDrill(A.reps[i]) : deskDrill(A.desk[i]);
}

function repDrill(r){
  const worst=r.lines.filter(l=>l.gapMoney<0).slice(0,5);
  const best=[...r.lines].sort((a,b)=>b.gapMoney-a.gapMoney).filter(l=>l.gapMoney>0).slice(0,2);
  return `
  <h3>What ${esc(r.name)}'s number is made of</h3>
  <p class="sub" style="margin-bottom:10px">${gbp(r.rev)} across ${r.jobs.toLocaleString()} jobs.
    ${r.coverage.toFixed(0)}% of it is work others also do, so that is the part we can judge fairly
    (${gbp(r.judged)}).</p>
  <div class="scroll"><table>
    <thead><tr><th>Work type</th><th class="num">Revenue</th><th class="num">Their margin</th>
    <th class="num">Everyone else</th><th class="num">Difference</th></tr></thead>
    <tbody>${r.lines.map(l=>`<tr><td>${esc(l.v).slice(0,34)}</td>
      <td class="num">${gbp(l.rev)}</td><td class="num">${l.actual.toFixed(1)}%</td>
      <td class="num">${l.expected.toFixed(1)}%</td>
      <td class="num ${l.gapMoney<0?'down':'up'}">${gbpk(l.gapMoney)}</td></tr>`).join('')}</tbody>
  </table></div>
  <h3>Their biggest accounts</h3>
  <div class="scroll"><table>
    <thead><tr><th>Customer</th><th class="num">Revenue</th><th class="num">Margin</th></tr></thead>
    <tbody>${r.topCust.map(c=>`<tr><td>${esc(c.c).slice(0,34)}</td>
      <td class="num">${gbp(c.rev)}</td>
      <td class="num ${c.margin<r.expected-8?'down':''}">${c.margin.toFixed(1)}%</td></tr>`).join('')}</tbody>
  </table></div>
  <h3>Worth asking</h3>
  <ul class="ask">
    ${worst.length?`<li>On <b>${esc(worst[0].v)}</b> you are at ${worst[0].actual.toFixed(1)}% where others get
      ${worst[0].expected.toFixed(1)}% — that one line is ${gbp(Math.abs(worst[0].gapMoney))}. What is different
      about how those are priced or sourced?</li>`:''}
    ${worst.length>1?`<li>The same pattern shows on <b>${esc(worst[1].v)}</b> (${pts(worst[1].actual-worst[1].expected)} pts).
      Is it the same customers driving both?</li>`:''}
    ${best.length?`<li>You are <b>ahead</b> on ${esc(best[0].v)} (${pts(best[0].actual-best[0].expected)} pts).
      What are you doing there that is not happening elsewhere?</li>`:''}
    ${r.coverage<60?`<li>Only ${r.coverage.toFixed(0)}% of this book is comparable to anyone else's, so treat
      the headline gap with care — most of what they do, only they do.</li>`:''}
  </ul>`;
}

function deskDrill(d){
  const worst=d.byCust.filter(c=>c.gapQuotes<0).slice(0,5);
  const bandRow=d.bands.sort((a,b)=>b.share-a.share).slice(0,5);
  const q1=n=>(n>=0?'+':'−')+Math.abs(n).toFixed(1);
  return `
  <h3>What ${esc(d.name)}'s number is made of</h3>
  <p class="sub" style="margin-bottom:10px">${d.quotes.toLocaleString()} quotes, ${d.judged.toLocaleString()} of them
    against customers others also quote — the judged part everything below is built on.
    Won ${gbp(d.wonVal)}, lost ${gbp(d.lostVal)}.
    ${d.gap!=null?`The <b>${pts(d.gap)} pt</b> gap means: they won <b>${d.wonJ}</b> of those
    ${d.judged.toLocaleString()} where the mix they were given says <b>${Math.round(d.expWins)}</b> was par —
    <b>${q1(d.gapQ)} quotes</b> vs par.`:''}
    ${d.s?`That is <b>${d.s.label}</b> at this sample size.`:''}</p>
  <h3>Quote mix</h3>
  <div class="scroll"><table>
    <thead><tr><th>Value band</th><th class="num">Share of their quotes</th><th></th></tr></thead>
    <tbody>${bandRow.map(b=>`<tr><td>${b.b}</td><td class="num">${b.share.toFixed(0)}%</td>
      <td><div class="bar"><i style="width:${b.share.toFixed(0)}%;background:var(--s1)"></i></div></td></tr>`).join('')}</tbody>
  </table></div>
  <h3>Where those ${q1(d.gapQ)} quotes sit</h3>
  <p class="sub" style="margin-bottom:8px">The last column is <b>quotes won versus par</b>, not
    percentage points — par being how that customer converts for everyone else, adjusted for quote
    value. The rows add up to the headline: biggest accounts first, everything else rolled into one line.</p>
  <div class="scroll"><table>
    <thead><tr><th>Customer</th><th class="num">Quotes</th><th class="num">Their rate</th>
    <th class="num">Par</th><th class="num">Quotes vs par</th></tr></thead>
    <tbody>${d.byCust.map(c=>`<tr><td>${esc(c.c).slice(0,32)}</td><td class="num">${c.n}</td>
      <td class="num">${c.actual.toFixed(0)}%</td><td class="num">${c.expected.toFixed(0)}%</td>
      <td class="num ${c.gapQuotes<0?'down':'up'}">${q1(c.gapQuotes)}</td></tr>`).join('')}
    ${d.restRow?`<tr><td class="muted">Everything else (${d.restRow.custs} customers)</td>
      <td class="num">${d.restRow.n}</td><td class="num">—</td><td class="num">—</td>
      <td class="num ${d.restRow.gapQuotes<0?'down':'up'}">${q1(d.restRow.gapQuotes)}</td></tr>`:''}
    <tr><td><b>Total — the headline gap</b></td><td class="num"><b>${d.judged}</b></td>
      <td class="num"><b>${d.actual.toFixed(0)}%</b></td><td class="num"><b>${d.expected==null?'—':d.expected.toFixed(0)+'%'}</b></td>
      <td class="num ${d.gapQ<0?'down':'up'}"><b>${q1(d.gapQ)}</b></td></tr></tbody>
  </table></div>
  <h3>Worth asking</h3>
  <ul class="ask">
    ${worst.length?`<li>On <b>${esc(worst[0].c)}</b> you convert ${worst[0].actual.toFixed(0)}% where par is
      ${worst[0].expected.toFixed(0)}%, across ${worst[0].n} quotes — ${Math.abs(worst[0].gapQuotes).toFixed(1)}
      quotes. Is that pricing, response time, or a relationship issue?</li>`:''}
    ${d.bands.find(b=>b.b==='500+'&&b.share>20)?`<li>${d.bands.find(b=>b.b==='500+').share.toFixed(0)}% of their quotes
      are over £500, where the whole desk only converts ${A.bandTable[4].rate.toFixed(0)}%. A low raw rate is
      partly the hand they are dealt.</li>`:''}
    ${d.s&&d.s.cls==='flat'?`<li>At ${d.quotes} quotes this gap is within normal variation. Worth watching,
      not worth a difficult conversation yet.</li>`:''}
    ${d.gap>4?`<li>They are beating their own book by ${pts(d.gap)} pts. What are they doing that others could copy?</li>`:''}
  </ul>`;
}

sb.auth.getSession().then(({data})=>{ if(data.session){ session=data.session; start(); } });
</script>
</body>
</html>
